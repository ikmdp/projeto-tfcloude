<div class="app">
  <aside class="lateral">
    <div class="topo">
      <app-logo [tamanho]="48" />
    </div>

    <nav class="menu" aria-label="Menu da coordenação">
      <a
        class="item"
        routerLink="/admin"
        routerLinkActive="ativo"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >Visão geral</a>

      <a class="item" routerLink="/admin/avaliacao" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        Fila de avaliação
        @if (naFila > 0) {
          <span class="contador" [attr.aria-label]="naFila + ' aguardando avaliação'">{{ naFila }}</span>
        }
      </a>

      <div class="grupo" role="group" aria-labelledby="grupo-acervo">
        <p class="titulo-grupo" id="grupo-acervo">Acervo</p>
        <a class="item" routerLink="/admin/acervo" routerLinkActive="ativo" ariaCurrentWhenActive="page">Consultar acervo</a>
        <a class="item" routerLink="/admin/gerenciar" routerLinkActive="ativo" ariaCurrentWhenActive="page">Gerenciar acervo</a>
      </div>

      <div class="grupo" role="group" aria-labelledby="grupo-cadastros">
        <p class="titulo-grupo" id="grupo-cadastros">Cadastros</p>
        <a class="item" routerLink="/admin/professores" routerLinkActive="ativo" ariaCurrentWhenActive="page">Professores</a>
        <a class="item" routerLink="/admin/cadastros" routerLinkActive="ativo" ariaCurrentWhenActive="page">Cursos</a>
      </div>

      <div class="grupo" role="group" aria-labelledby="grupo-acompanhamento">
        <p class="titulo-grupo" id="grupo-acompanhamento">Acompanhamento</p>
        <a class="item" routerLink="/admin/relatorios" routerLinkActive="ativo" ariaCurrentWhenActive="page">Relatórios</a>
        <a class="item" routerLink="/admin/atividades" routerLinkActive="ativo" ariaCurrentWhenActive="page">Registro de atividades</a>
      </div>
    </nav>

        <div class="rodape">
      <span class="selo">Coordenação</span>
      <button type="button" class="acao sair" (click)="sair()">Sair</button>
    </div>
  </aside>

  <main class="conteudo">
    <router-outlet />
  </main>
</div>
