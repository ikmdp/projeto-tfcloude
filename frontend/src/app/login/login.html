<main class="pagina">
  <section class="cartao">
    <header class="marca">
      <h1>TFCloud</h1>
      <span>ESCOLA TÉCNICA</span>
    </header>

    <h2>Acesse sua conta</h2>
    <p class="descricao">Insira suas credenciais institucionais</p>

    <form (ngSubmit)="entrar()">
      <label for="email">E-mail institucional</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="exemplo@inst.gov.br"
        [(ngModel)]="email"
        autocomplete="email"
      />

      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input
          id="senha"
          name="senha"
          [type]="mostrarSenha ? 'text' : 'password'"
          placeholder="Digite sua senha"
          [(ngModel)]="senha"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="olho"
          (click)="alternarSenha()"
          [attr.aria-label]="mostrarSenha ? 'Esconder senha' : 'Mostrar senha'"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="linha-opcoes">
        <label class="lembrar">
          <input type="checkbox" name="lembrar" [(ngModel)]="lembrar" />
          Lembrar neste dispositivo
        </label>
       <a routerLink="/esqueci-senha">Esqueci minha senha</a>
      </div>
      
            @if (erro) {
        <p class="erro" role="alert">{{ erro }}</p>
      }

      <button type="submit" class="btn-entrar">Entrar</button>
    </form>

    <p class="rodape">Novo na plataforma? <a routerLink="/cadastro">Criar conta</a></p>
  </section>
</main>
