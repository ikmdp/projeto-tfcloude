<main class="home">
  <app-logo [tamanho]="88" [empilhado]="true" />

  <h1>O acervo digital definitivo para<br />Trabalhos Finais de Curso</h1>

  <p class="subtitulo">
    Gerencie, avalie, consulte e envie seus projetos de TFC de forma simples,<br />
    transparente e totalmente integrada à coordenação escolar.
  </p>

  <button type="button" class="btn-comecar" (click)="comecar()">Começar</button>

  <div class="stats">
    @for (item of estatisticas; track item.legenda) {
      <div class="stat">
        <span class="valor" [class.verde]="item.verde">{{ item.valor }}</span>
        <span class="legenda">{{ item.legenda }}</span>
      </div>
    }
  </div>
</main>
